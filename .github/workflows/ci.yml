name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Fight engine tests
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: Swift version
        run: swift --version
      - name: Test FightCore (rules, CPU, arcade, balance round-robin)
        working-directory: Packages/FightCore
        run: swift test

  app:
    name: iOS app build and UI tests
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: Pick an iPhone simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted((r for r in devices if "iOS" in r), reverse=True)
          for runtime in ios:
              for d in devices[runtime]:
                  if d["name"].startswith("iPhone") and "Pro" in d["name"]:
                      print(d["udid"]); sys.exit()
          for runtime in ios:
              for d in devices[runtime]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit()
          ')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$udid"
      - name: Build and test
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test \
            -project AetheriaClash.xcodeproj \
            -scheme AetheriaClash \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/xcodebuild.log | grep -E "error:|Test Case.*(passed|failed)|TEST (SUCCEEDED|FAILED)|BUILD (SUCCEEDED|FAILED)"
      - name: Keep test results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/TestResults.xcresult
            build/xcodebuild.log
          retention-days: 14

  release-build:
    name: Release build for device (unsigned)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: Build Release for iOS devices
        run: |
          set -o pipefail
          xcodebuild build \
            -project AetheriaClash.xcodeproj \
            -scheme AetheriaClash \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/Release \
            CODE_SIGNING_ALLOWED=NO \
            | grep -E "error:|warning: .*\.swift|BUILD (SUCCEEDED|FAILED)"
